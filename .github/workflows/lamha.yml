
name: Lamha Shorts

on:
  schedule:
    - cron: "0 3 * * *"     # 06:00 الرياض
    - cron: "30 6 * * *"    # 09:30 الرياض
  workflow_dispatch:
    inputs:
      task:
        description: "test = اختبار بدون نشر | production = انتاج وانشر فيديو حقيقي | assets = ولّد الشعار والبانر"
        default: "test"
        type: choice
        options: [test, production, assets]

permissions:
  contents: write

concurrency:
  group: lamha
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-hosny-amiri fontconfig librsvg2-bin
          pip install -q edge-tts requests numpy pillow arabic-reshaper python-bidi \
            google-api-python-client google-auth google-auth-httplib2

      - name: Generate logo and banner
        if: ${{ github.event.inputs.task == 'assets' }}
        run: python main.py assets

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.task == 'assets' }}
        with:
          name: lamha-brand
          path: |
            logo.png
            banner.png

      - name: Make video and publish
        if: ${{ github.event.inputs.task != 'assets' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.task == 'test' && '1' || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          ok=0
          for i in 1 2 3; do
            if python main.py; then ok=1; break; fi
            echo "attempt $i failed, retrying in 40s"; sleep 40
          done
          [ "$ok" = "1" ] || exit 1

      - name: Save state
        if: ${{ always() && github.event.inputs.task != 'assets' && github.event.inputs.task != 'test' }}
        run: |
          git config user.name "lamha-bot"
          git config user.email "lamha-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state"
            git pull --rebase -q || true
            git push -q || true
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.task == 'test' }}
        with:
          name: lamha-test-video
          path: out/video.mp4
